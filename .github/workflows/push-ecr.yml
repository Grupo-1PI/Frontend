name: Push Manual Frontend para AWS ECR

on:
  workflow_dispatch:
    inputs:
      aws_access_key_id:
        description: 'AWS Access Key ID'
        required: true
        type: string

      aws_secret_access_key:
        description: 'AWS Secret Access Key'
        required: true
        type: string

      aws_session_token:
        description: 'AWS Session Token'
        required: true
        type: string

      aws_region:
        description: 'AWS Region'
        required: true
        default: 'us-east-1'
        type: string

      ecr_repository:
        description: 'Nome do repositório no ECR'
        required: true
        default: 'tao-tenshin-frontend'
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código da branch production
      - name: Checkout Código
        uses: actions/checkout@v4
        with:
          ref: production

      # 2. Configura as credenciais da AWS
      - name: Configurar AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ inputs.aws_access_key_id }}
          aws-secret-access-key: ${{ inputs.aws_secret_access_key }}
          aws-session-token: ${{ inputs.aws_session_token }}
          aws-region: ${{ inputs.aws_region }}

      # 3. Verifica as credenciais
      - name: Verificar credenciais AWS
        run: |
          aws sts get-caller-identity

      # 4. Login no Amazon ECR
      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 5. Cria o repositório caso ainda não exista
      - name: Criar repositório ECR
        run: |
          aws ecr describe-repositories \
            --repository-names "${{ inputs.ecr_repository }}" \
            --region "${{ inputs.aws_region }}" \
          || aws ecr create-repository \
            --repository-name "${{ inputs.ecr_repository }}" \
            --region "${{ inputs.aws_region }}"

      # 6. Define o endereço da imagem
      - name: Definir imagem
        id: image
        run: |
          echo "image=${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository }}" >> "$GITHUB_OUTPUT"

      # 7. Build e Push da imagem
      - name: Build e Push da Imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          no-cache: true
          tags: |
            ${{ steps.image.outputs.image }}:latest
            ${{ steps.image.outputs.image }}:${{ github.sha }}
