name: Deploy Automático para o Docker Hub

on:
  push:
    branches:
      - production # Dispara sempre que houver commit ou merge nesta branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Baixa o código-fonte atual da branch production
      - name: Checkout Código
        uses: actions/checkout@v4

      # 2. Faz o login no Docker Hub usando as credenciais do seu cofre (Secrets)
      - name: Logar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Constrói a imagem a partir do seu Dockerfile e envia para o Docker Hub
      - name: Build e Push da Imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tao-tenshin_front-end:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tao-tenshin_front-end:${{ github.sha }}
